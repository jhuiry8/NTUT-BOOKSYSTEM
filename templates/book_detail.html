<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>書籍購買名單</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-5xl mx-auto">
        <div class="mb-6 flex justify-between items-center">
            <a href="{{ url_for('admin.admin_dashboard') }}" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 shadow transition">
                ⬅ 返回後台
            </a>
            <div class="text-right">
                <h1 class="text-2xl font-bold text-gray-800">📘 《{{ book.title }}》</h1>
                <p class="text-gray-500">售價：${{ book.price }}</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="bg-white p-4 rounded shadow-lg border-t-4 border-green-500">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h2 class="font-bold text-xl text-green-700">✅ 已購買 ({{ bought|length }} 人)</h2>
                </div>
                
                <div class="overflow-y-auto max-h-[60vh]">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th class="p-2 border-b">學號</th>
                                <th class="p-2 border-b">姓名</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for s in bought %}
                            <tr class="border-b hover:bg-green-50">
                                <td class="p-2 font-mono text-gray-700">{{ s.sid }}</td>
                                <td class="p-2 font-bold text-gray-800">{{ s.name }}</td>
                            </tr>
                            {% else %}
                            <tr><td colspan="2" class="p-4 text-center text-gray-400">目前無人購買</td></tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white p-4 rounded shadow-lg border-t-4 border-red-500">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h2 class="font-bold text-xl text-red-700">❌ 未購買 ({{ not_bought|length }} 人)</h2>
                </div>
                
                <div class="overflow-y-auto max-h-[60vh]">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th class="p-2 border-b">學號</th>
                                <th class="p-2 border-b">姓名</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for s in not_bought %}
                            <tr class="border-b hover:bg-red-50 text-gray-500">
                                <td class="p-2 font-mono">{{ s.sid }}</td>
                                <td class="p-2">{{ s.name }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
